org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# App identity. Change these three lines if you fork the project.
# applicationId MUST NOT be com.yl.milight: the original app is signed with a
# debug certificate, so a build with a different key can never upgrade it.
# ---------------------------------------------------------------------------
ambient.applicationId=com.juzhen.ambientlight
ambient.versionCode=7
ambient.versionName=2.6.0

# ---------------------------------------------------------------------------
# The lamp the desktop cards (app widgets) auto-connect to.
# ---------------------------------------------------------------------------
ambient.pinnedMac=FF:FF:10:98:3C:D9
